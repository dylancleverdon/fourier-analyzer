name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Windows installer scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'installer/windows/install.ps1', 'installer/windows/uninstall.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error "$f : $_" }; exit 1 }
          }
          python installer/make_icon.py "$env:RUNNER_TEMP/fa.ico"
